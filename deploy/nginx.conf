# QAROMI ERP — reverse proxy tới Node (127.0.0.1:4325)
# Đặt tại /etc/nginx/sites-available/qaromi-erp
# Nếu có domain, thay server_name và dùng certbot để lấy HTTPS.

server {
    # Port riêng cho ERP — port 80 đang bị ứng dụng khác chiếm.
    # Muốn đổi port: sửa 2 dòng listen bên dưới + mở port tương ứng trong ufw.
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Upload Excel (body nhị phân) — app giới hạn 25MB, chừa dư
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4325;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
