<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QAROMI ERP — Hệ Thống Điều Hành Doanh Nghiệp</title>
  <link rel="stylesheet" href="./styles.css?v=10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Clean Product Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <div class="brand-text">
          <div class="brand-title">QAROMI ERP</div>
          <div class="brand-subtitle">Xí nghiệp Nước Hòn Gai — QUAWACO</div>
        </div>
      </div>

      <!-- Navigation Menu: 6 Clean Modules -->
      <nav id="nav" class="nav-menu"></nav>

      <div class="sidebar-footer">
        <div class="footer-period">
          <span class="icon">📅</span>
          <div>
            <div class="period-label">Kỳ kế toán</div>
            <div class="period-value">Tháng 9 / 2026</div>
          </div>
        </div>
        <div class="footer-note">Phiên bản 1.0.0 • QUAWACO</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Clean Product Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="breadcrumbs" id="top-breadcrumbs">
            <span class="breadcrumb-item">QAROMI</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-item active" id="breadcrumb-title">Bảng điều khiển</span>
          </div>
          <h1 id="page-title">Bảng điều khiển</h1>
        </div>
        <div class="topbar-right">
          <div class="top-period-pill">
            <span class="pill-dot"></span>
            <span>Tháng 09/2026</span>
          </div>
          <button class="btn btn-primary btn-sm" id="btn-quick-order">＋ Báo giá mới</button>
          <button class="btn btn-secondary btn-sm" id="btn-quick-dvgt">＋ Đăng ký DVGT</button>
          <div class="user-profile-pill">
            <div class="user-avatar">L</div>
            <div class="user-details">
              <span class="user-name">Phạm Văn Long</span>
              <span class="user-role">Tư vấn giải pháp ERP</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <section id="view-container" class="view-container"></section>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Modal Dialog -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-dialog" id="modal-box"></div>
  </div>

  <script src="./app.js?v=10"></script>
</body>
</html>
